<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lb-title" hidden>
  <div class="lightbox__scrim" data-close></div>
  <div class="lightbox__panel" role="document">
    <button class="lightbox__close" type="button" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
    <div class="lightbox__media" id="lb-media"></div>
    <div class="lightbox__body">
      <p class="lightbox__frame" id="lb-frame"></p>
      <h2 class="lightbox__title" id="lb-title"></h2>
      <p class="lightbox__meta" id="lb-meta"></p>
      <div class="lightbox__text" id="lb-text"></div>
      <div class="lightbox__nav">
        <button type="button" id="lb-prev">← Previous frame</button>
        <button type="button" id="lb-next">Next frame →</button>
      </div>
    </div>
  </div>
</div>
