<div class="rail">
  <div class="rail__inner">
    <a class="rail__cell rail__cell--link" href="/">typocasual</a>

    <span class="rail__cell rail__cell--now">
      {{- if .IsHome }}The type
      {{- else if .IsPage }}Essay
      {{- else }}Essays{{ end -}}
    </span>

    {{- if or .IsHome .IsPage }}
      <a class="rail__cell rail__cell--link" href="/posts/">Essays</a>
    {{- end }}

    {{- if not .IsHome }}
      <a class="rail__cell rail__cell--link" href="/">Front page</a>
    {{- end }}

    <span class="rail__spacer"></span>

    <button class="rail__cell rail__cell--btn" id="theme-toggle" type="button" aria-live="polite">
      <span class="dot" aria-hidden="true"></span><span id="theme-label">Moonlit</span>
    </button>
  </div>
</div>
