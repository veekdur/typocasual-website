<!-- SVG filters and gradients shared by every page. -->
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- Roughens any edge into something grown rather than drawn. -->
    <filter id="overgrown" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.02" numOctaves="4" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="34" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="overgrown-fine" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.07" numOctaves="3" seed="19" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <linearGradient id="mossBank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4f6b33"/>
      <stop offset="45%"  stop-color="#33481f"/>
      <stop offset="100%" stop-color="#131f0e"/>
    </linearGradient>
    <linearGradient id="mossBankLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8fae56"/>
      <stop offset="60%"  stop-color="#5b7a34"/>
      <stop offset="100%" stop-color="#2c3f1b"/>
    </linearGradient>
    <radialGradient id="dapple" cx="50%" cy="0%" r="80%">
      <stop offset="0%"   stop-color="#e6d58f" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#e6d58f" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
